name: Refresh Instagram feed

# Every hour at 23 minutes past (GitHub is busiest on the hour), plus a
# "Run workflow" button for a manual check. Each run makes exactly one call
# to Behold: about 744 a month, under the free plan's 1,200.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Read Behold and update feed.json
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: node scripts/refresh.mjs

      - name: Save the update
        run: |
          if git diff --quiet -- feed.json; then
            echo "Nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Update Instagram feed"
          git push
