name: Refresh Instagram feed

# GitHub starts scheduled runs late or not at all when it is busy (in early Oct
# 2026 it often went 7 hours without one), so a scheduled run does not just
# check once and leave: it stays for about five hours and checks Behold at five
# past every hour. GitHub then only needs to start the job every few hours,
# which it does manage. The script still reads Behold at most once per clock
# hour, so this never makes more than 24 calls a day (744 in a month, under the
# free plan's 1,200). "Run workflow", and any change to this job, check once
# straight away and finish.
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh.yml
      - scripts/**

permissions:
  contents: write

# Scheduled runs queue behind the one that is running (one waits, newer ones
# replace it), so they hand over one to the next. A manual run never waits.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'refresh-feed' || format('refresh-feed-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      # .last-read holds the time of the last Behold call. It travels from run
      # to run in the Actions cache and is never committed.
      - name: Recall the last Behold read
        uses: actions/cache/restore@v6
        with:
          path: .last-read
          key: last-read-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-read-

      - name: Read Behold every hour and save feed.json
        id: refresh
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stop=$(( $(date +%s) + 5 * 3600 + 15 * 60 ))
          alert=0
          while :; do
            node scripts/refresh.mjs || alert=1
            if ! git diff --quiet -- feed.json; then
              git add feed.json
              git commit --quiet -m "Update Instagram feed"
            fi
            # push anything not yet on GitHub (a failed push is retried next hour)
            if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
              git pull --rebase --quiet origin main && git push --quiet origin HEAD:main \
                || echo "::warning::Could not save this update; trying again next hour."
            fi
            # a run started by hand or by a change to the job checks once
            [ "$EVENT" = schedule ] || break
            now=$(date +%s)
            next=$(( (now / 3600 + 1) * 3600 + 300 ))
            [ "$next" -lt "$stop" ] || break
            echo "Next check at $(date -u -d "@$next" +%H:%M) UTC."
            sleep $(( next - now ))
          done
          exit $alert

      # also after a failed read: that call still counted as a Behold view
      - name: Remember the last Behold read
        if: ${{ !cancelled() && steps.refresh.outputs.read == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .last-read
          key: last-read-${{ github.run_id }}-${{ github.run_attempt }}
